<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Marin County Story Coverage</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { height: 100%; margin: 0; }
#map { height: 100%; width: 100%; }

.leaflet-tooltip.count-label {
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
  margin: 0;
  color: #111;
  font-weight: 700;
  font-size: 15px;
  text-shadow:
    -1px -1px 0 #fff,
     1px -1px 0 #fff,
    -1px  1px 0 #fff,
     1px  1px 0 #fff;
}

.legend {
  background: rgba(255,255,255,0.95);
  padding: 12px;
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  font: 13px system-ui;
}
.legend h3 { margin:0 0 6px 0; font-size:14px; }
.legend .note { margin-top:6px; font-size:12px; }

.hotspot {
  position: relative;
  width: 36px;
  height: 36px;
}
.hotspot .core {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  transform: translate(-50%, -50%);
  background: #bada55;
  border: 2px solid #111;
  border-radius: 50%;
}
</style>
</head>
<body>
<div id="map"></div>

<script>
const coverage = [
{"city":"Bolinas","count":1,"lat":37.909,"lon":-122.686},
{"city":"Corte Madera","count":6,"lat":37.925,"lon":-122.527},
{"city":"Fairfax","count":4,"lat":37.987,"lon":-122.588},
{"city":"Inverness","count":2,"lat":38.101,"lon":-122.856},
{"city":"Kentfield","count":1,"lat":37.952,"lon":-122.556},
{"city":"Larkspur","count":2,"lat":37.934,"lon":-122.536},
{"city":"Mill Valley","count":5,"lat":37.906,"lon":-122.545},
{"city":"Novato","count":14,"lat":38.107,"lon":-122.569},
{"city":"Point Reyes Station","count":7,"lat":38.069,"lon":-122.806},
{"city":"San Anselmo","count":1,"lat":37.974,"lon":-122.562},
{"city":"San Rafael","count":38,"lat":37.973,"lon":-122.531},
{"city":"Santa Venetia","count":1,"lat":37.998,"lon":-122.545},
{"city":"Sausalito/Marin City","count":44,"lat":37.859,"lon":-122.486}
];

const specificStories = 127;
const generalStories = 15;
const totalStories = 142;

const map = L.map('map');
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

// Marin County official boundary (FIPS 06041)
fetch("https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json")
.then(res => res.json())
.then(data => {
  const marin = {
    type: "FeatureCollection",
    features: data.features.filter(f => f.id === "06041")
  };

  const countyLayer = L.geoJSON(marin, {
    style: {
      color: "transparent",
      fillColor: "rgba(138,47,120,0.8)",
      fillOpacity: 0.8
    }
  }).addTo(map);

  map.fitBounds(countyLayer.getBounds().pad(0.05));
});

// Add markers
const labelItems = [];

coverage.forEach(d => {
  const marker = L.marker([d.lat, d.lon], {
    icon: L.divIcon({
      className: '',
      html: `<div class="hotspot"><div class="core"></div></div>`,
      iconSize: [36,36],
      iconAnchor: [18,18]
    })
  }).addTo(map);

  marker.bindTooltip(`${d.city} ${d.count}`, {
    permanent: true,
    direction: 'right',
    offset: [14,0],
    className: 'count-label'
  });

  marker.bindPopup(`<strong>${d.city}</strong><br>${d.count} stories`);

  labelItems.push({ marker, count: d.count });
});

// Collision detection
function resolveLabelOverlaps() {
  const items = labelItems
    .map(it => {
      const el = it.marker.getTooltip()?.getElement();
      return el ? {...it, el} : null;
    })
    .filter(Boolean);

  items.sort((a,b) => b.count - a.count);

  const kept = [];
  items.forEach(it => {
    it.el.style.display = '';
    const r = it.el.getBoundingClientRect();
    const overlaps = kept.some(k =>
      !(r.right < k.left || r.left > k.right || r.bottom < k.top || r.top > k.bottom)
    );
    if (overlaps) it.el.style.display = 'none';
    else kept.push(r);
  });
}

map.on('zoomend moveend', () => setTimeout(resolveLabelOverlaps, 100));
setTimeout(resolveLabelOverlaps, 300);

// Legend
const legend = L.control({position: 'bottomleft'});
legend.onAdd = function() {
  const div = L.DomUtil.create('div','legend');
  div.innerHTML = `
    <h3>Marin County Story Coverage</h3>
    <div>Story hotspots</div>
    <div class="note">
      General Marin County stories: <strong>${generalStories}</strong><br>
      Specific Marin County stories: <strong>${specificStories}</strong><br>
      Total: <strong>${totalStories}</strong><br><br>
      * Of the 44 Sausalito and Marin stories, 21 came from Radio Sausalito, a Bay Area–based radio segment.
    </div>
  `;
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
